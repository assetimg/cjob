<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gateway Portal - Node 81</title>
    <!-- Font bergaya siber dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-green: #39ff14;
            --bg-deep: #030305;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-color: var(--bg-deep);
            /* Grid matriks siber yang sangat rapat */
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                linear-gradient(90deg, rgba(0, 243, 255, 0.03), rgba(0, 0, 0, 0), rgba(255, 0, 85, 0.02));
            background-size: 100% 4px, 6px 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            color: #ffffff;
            overflow: hidden;
        }

        /* Scanline CRT Bergerak Turun */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            animation: scanlineScroll 6s linear infinite;
            z-index: 99;
            pointer-events: none;
            opacity: 0.6;
        }

        .dashboard-container {
            width: 440px;
            max-width: 95%;
            padding: 30px;
            border: 1px solid rgba(0, 243, 255, 0.15);
            background: rgba(5, 5, 8, 0.93);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.05);
            border-radius: 4px;
            position: relative;
            z-index: 10;
        }

        /* Aksen Sudut Desain Siber (Tech Corners) */
        .dashboard-container::before, .dashboard-container::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--neon-cyan);
        }
        /* Kiri Atas */
        .dashboard-container::before {
            top: -2px; left: -2px;
            border-right: none; border-bottom: none;
        }
        /* Kanan Bawah */
        .dashboard-container::after {
            bottom: -2px; right: -2px;
            border-left: none; border-top: none;
        }

        /* -------------------------------------------
           HUD ROTATING SCANNER 
        ------------------------------------------- */
        .hud-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 25px auto;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Lingkaran Luar (Cyan) */
        .circle.outer {
            width: 150px; height: 150px;
            border-top-color: var(--neon-cyan);
            border-bottom-color: var(--neon-cyan);
            animation: rotateCW 4s linear infinite;
        }

        /* Lingkaran Tengah (Dashed Magenta) */
        .circle.middle {
            width: 120px; height: 120px;
            border-left-color: var(--neon-magenta);
            border-right-color: var(--neon-magenta);
            border-style: dashed;
            animation: rotateCCW 3s linear infinite;
        }

        /* Lingkaran Dalam (Dotted Green) */
        .circle.inner {
            width: 80px; height: 80px;
            border: 2px dotted var(--neon-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
            animation: pulseGlow 1.5s ease-in-out infinite alternate;
        }

        /* -------------------------------------------
           TERMINAL DIAGNOSTICS LOG 
        ------------------------------------------- */
        .terminal-box {
            background: #020203;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            height: 140px;
            overflow: hidden;
            text-align: left;
            border-radius: 2px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            line-height: 1.5;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 1);
        }

        .log-stream p {
            opacity: 0;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: fadeInLog 0.2s forwards;
        }

        /* Efek Teks Masuk Bertahap */
        .log-stream p:nth-child(1) { color: var(--neon-green); animation-delay: 0.5s; }
        .log-stream p:nth-child(2) { color: #ffffff; animation-delay: 1.8s; }
        .log-stream p:nth-child(3) { color: var(--neon-magenta); animation-delay: 3.2s; }
        .log-stream p:nth-child(4) { color: var(--neon-green); animation-delay: 4.8s; }
        .log-stream p:nth-child(5) { color: var(--neon-cyan); animation-delay: 6.2s; }

        /* -------------------------------------------
           CYBER BUTTON 
        ------------------------------------------- */
        .cyber-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }

        .cyber-btn:hover {
            background: rgba(0, 243, 255, 0.07);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .cyber-btn:active {
            transform: scale(0.98);
        }

        /* -------------------------------------------
           ANIMASI TIMELINE 
        ------------------------------------------- */
        @keyframes rotateCW {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes rotateCCW {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(-360deg); }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; box-shadow: inset 0 0 5px rgba(57, 255, 20, 0.1); }
            100% { opacity: 1; box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.3); }
        }

        @keyframes fadeInLog {
            to { opacity: 1; }
        }

        @keyframes scanlineScroll {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        @media (max-width: 480px) {
            .dashboard-container { padding: 20px 15px; }
            .hud-wrapper { width: 130px; height: 130px; }
            .circle.outer { width: 120px; height: 120px; }
            .circle.middle { width: 100px; height: 100px; }
            .circle.inner { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- HUD Scanner Area -->
        <div class="hud-wrapper">
            <div class="circle outer"></div>
            <div class="circle middle"></div>
            <div class="circle inner">SECURE</div>
        </div>

        <!-- Terminal Security Check Logs -->
        <div class="terminal-box">
            <div class="log-stream">
                <p>&gt; [SYS] Initializing Diagnostics Protocol...</p>
                <p>&gt; [OK] Core Firewall status: ACTIVE</p>
                <p>&gt; [WARN] Port 8080 routing required</p>
                <p>&gt; [OK] Traffic securely encrypted via SSL</p>
                <p>&gt; [SYS] Gateway Node: SECURE & READY</p>
            </div>
        </div>

        <!-- Cyber Button -->
        <button class="cyber-btn" onclick="window.location.reload();">
            ENTER PORTAL
        </button>
    </div>

</body>
</html>
